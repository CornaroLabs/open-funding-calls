name: test
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema rfc3339-validator pytest
      - run: cd python && python -m pytest -q
      - run: cd python && python -m open_funding_calls ../examples/nlnet-restack-2.json ../examples/dao-rolling-grant.json
